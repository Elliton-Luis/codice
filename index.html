<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Bíblico Católico</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Quiz Bíblico Católico</h1>
            <div class="timer hidden">
                Tempo: <span id="cronometer-display">60s</span>
            </div>
            <div class="score hidden">
                Acertos: <span id="correct-score">0</span> | Erros: <span id="incorrect-score">0</span>
            </div>
        </header>
        <main>
            <div id="difficulty-selection" class="difficulty-selection">
                <p class="selection-prompt">Escolha o nível de dificuldade:</p>
                <button class="button difficulty-btn" data-difficulty="EASY">Fácil</button>
                <button class="button difficulty-btn" data-difficulty="MEDIUM">Médio</button>
                <button class="button difficulty-btn" data-difficulty="HARD">Difícil</button>
                <button class="button difficulty-btn hardcore-btn" data-difficulty="HARD" data-hardcore="true">Hardcore</button>
            </div>

            <div id="quiz-card" class="quiz-card hidden">
                <p id="question-text" class="question-text"></p>
                <div id="alternatives-container" class="alternatives-container">
                    <!-- Alternatives will be loaded here by JavaScript -->
                </div>
                <button id="give-up-btn" class="button give-up-btn">Desistir</button>
                <div id="feedback-container" class="feedback-container hidden">
                    <p id="feedback-message" class="feedback-message"></p>
                    <p id="correct-answer" class="correct-answer"></p>
                    <p id="explanation" class="explanation"></p>
                    <p id="reference" class="reference"></p>
                    <button id="next-question-btn" class="button">Próxima Pergunta</button>
                </div>
            </div>
            <div id="loading-message" class="loading-message">
                Carregando perguntas...
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
